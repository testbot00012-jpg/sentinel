<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Sentinel AI Cybersecurity Console</title>
  <meta name="description" content="Secure login and authentication gateway for Sentinel AI Cyber Defense Console.">

  <!-- Instant redirect to index.html if already logged in -->
  <script>
    (function() {
      const token = localStorage.getItem('sentinel_auth_token');
      const user = localStorage.getItem('sentinel_user_profile');
      try {
        const u = JSON.parse(user);
        if (token && u && !u.is_guest) {
          window.location.replace('index.html');
        }
      } catch(e) {}
    })();
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/style.css">
</head>
<body style="min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:2rem 1rem;">
  <!-- Ambient Cyber Background Grid -->
  <div class="cyber-grid-overlay"></div>

  <!-- Main Login Container -->
  <div style="width:100%;max-width:460px;position:relative;z-index:10;">
    <!-- Brand Header -->
    <div style="text-align:center;margin-bottom:2rem;">
      <div style="display:inline-flex;align-items:center;justify-content:center;width:68px;height:68px;border-radius:20px;background:rgba(0,242,254,0.1);border:1px solid rgba(0,242,254,0.3);box-shadow:0 0 35px rgba(0,242,254,0.25);margin-bottom:1rem;">
        <svg viewBox="0 0 24 24" width="36" height="36" fill="#00f2fe">
          <path d="M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5zm0 3.3l6 3.33v4.37c0 4.14-2.82 8.01-6 9.17-3.18-1.16-6-5.03-6-9.17V8.63l6-3.33zm-1 5.7h2v5h-2zm0 6h2v2h-2z"/>
        </svg>
      </div>
      <h1 style="font-size:1.85rem;font-family:var(--font-heading);letter-spacing:0.04em;color:var(--text-main);margin-bottom:0.25rem;">
        SENTINEL AI
      </h1>
      <div class="status-badge" style="display:inline-flex;margin:0 auto;">
        <span class="pulse-dot"></span>
        <span>ENTERPRISE SECURITY ACCESS GATEWAY</span>
      </div>
    </div>

    <!-- Auth Glassmorphism Card -->
    <div class="glass-panel" style="padding:2.25rem 2rem;border-radius:var(--radius-lg);box-shadow:var(--shadow-card);">
      <!-- Auth Mode Tabs -->
      <div style="display:flex;gap:0.5rem;background:rgba(11,17,32,0.6);padding:4px;border-radius:var(--radius-md);margin-bottom:1.75rem;border:1px solid var(--border-subtle);">
        <button id="tab-btn-login" class="filter-btn active" style="flex:1;text-align:center;padding:0.6rem;">Sign In</button>
        <button id="tab-btn-register" class="filter-btn" style="flex:1;text-align:center;padding:0.6rem;">Create Account</button>
      </div>

      <!-- 1. SIGN IN FORM -->
      <form id="form-login" style="display:block;">
        <div class="form-group" style="margin-bottom:1.25rem;">
          <label for="login-email" class="form-label">Email Address</label>
          <input 
            type="email" 
            id="login-email" 
            class="cyber-input" 
            placeholder="name@domain.com" 
            required 
            autocomplete="email"
          />
        </div>

        <div class="form-group" style="margin-bottom:1.75rem;">
          <label for="login-password" class="form-label">Password</label>
          <input 
            type="password" 
            id="login-password" 
            class="cyber-input" 
            placeholder="Enter account password" 
            required 
            autocomplete="current-password"
          />
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="padding:0.85rem;font-size:0.95rem;">
          <span>⚡</span> Sign In to Sentinel Console
        </button>
      </form>

      <!-- 2. CREATE ACCOUNT FORM -->
      <form id="form-register" style="display:none;">
        <div class="form-group" style="margin-bottom:1.25rem;">
          <label for="reg-name" class="form-label">Full Name</label>
          <input 
            type="text" 
            id="reg-name" 
            class="cyber-input" 
            placeholder="Full Name / Officer Handle" 
            required 
            autocomplete="name"
          />
        </div>

        <div class="form-group" style="margin-bottom:1.25rem;">
          <label for="reg-email" class="form-label">Email Address</label>
          <input 
            type="email" 
            id="reg-email" 
            class="cyber-input" 
            placeholder="name@domain.com" 
            required 
            autocomplete="email"
          />
        </div>

        <div class="form-group" style="margin-bottom:1.75rem;">
          <label for="reg-password" class="form-label">Password (Minimum 6 characters)</label>
          <input 
            type="password" 
            id="reg-password" 
            class="cyber-input" 
            placeholder="Create a strong password" 
            required 
            minlength="6"
            autocomplete="new-password"
          />
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="padding:0.85rem;font-size:0.95rem;">
          <span>🛡️</span> Create Sentinel Account
        </button>
      </form>

      <!-- Trust Badges -->
      <div style="margin-top:2rem;padding-top:1.25rem;border-top:1px solid var(--border-subtle);display:flex;justify-content:center;gap:1rem;flex-wrap:wrap;">
        <span class="footer-pill" style="font-size:0.72rem;padding:3px 8px;">🔒 TLS 1.3 Encrypted</span>
        <span class="footer-pill" style="font-size:0.72rem;padding:3px 8px;"><span class="pulse-dot"></span> Railway Live Cloud</span>
        <span class="footer-pill" style="font-size:0.72rem;padding:3px 8px;">📱 Android Synced</span>
      </div>
    </div>

    <!-- Footer Copyright -->
    <div style="text-align:center;margin-top:1.5rem;color:var(--text-sub);font-size:0.75rem;">
      © 2026 Sentinel Cyber Technologies • Zero-Trust Access
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Scripts -->
  <script src="./js/api.js"></script>
  <script src="./js/app.js"></script>
  <script src="./js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.authController) {
        window.authController.init();
      }
    });
  </script>
</body>
</html>
